<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Electrical Buddy</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>CEC Electrical Tool</h1>
        <p>Conductor amp Lookup</p>
    </header>

    <main>

        <section class="controls">
            <label for="conductor-size">Conductor Size:</label>
            <select id="conductorSizeInput">
                <option value="" Selected>Select Size</option>

            </select>
            <label for="demandInput">Demand:</label>
            <input type="number" id="demandInput" min="0">
            <p id="result"></p>

            <label for="temperatureInput">Temperature Rating:</label>
            <select id="temperatureInput">
                <option value="amp60">60°C</option>
                <option value="amp75" selected>75°C</option>
                <option value="amp90">90°C</option>
            </select>
        </section>

        <section class="table-section">

            <h2>Table 2 — Copper Conductors</h2>

            <table>

                <thead>
                    <tr>
                        <th>AWG</th>
                        <th>60°C</th>
                        <th>75°C</th>
                        <th>90°C</th>
                    </tr>
                </thead>

                <tbody>
                </tbody>

            </table>

        </section>

    </main>

</body>

</html>
